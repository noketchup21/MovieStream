version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: moviestream-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-moviestream}
    volumes:
      - mongodb_data:/data/db
    networks:
      - moviestream-network

  # Go Backend API
  backend:
    build:
      context: ./Server/MovieStream
      dockerfile: Dockerfile
    container_name: moviestream-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MongoDB Connection
      MONGODB_URI: mongodb+srv://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DATABASE}?retryWrites=true&w=majority
      DATABASE_NAME: ${MONGO_DATABASE}
      
      # JWT Secrets
      SECRET_KEY: ${SECRET_KEY}
      SECRET_REFRESH_KEY: ${SECRET_REFRESH_KEY}
      
      # Email Configuration
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BASE_PROMPT_TEMPLATE: ${BASE_PROMPT_TEMPLATE}
      
      # App Config
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RECOMMENDED_MOVIE_LIMIT: ${RECOMMENDED_MOVIE_LIMIT:-5}
    depends_on:
      - mongodb
    networks:
      - moviestream-network

  # React Frontend
  frontend:
    build:
      context: ./Client/movie-stream-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: moviestream-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - moviestream-network

volumes:
  mongodb_data:
    driver: local

networks:
  moviestream-network:
    driver: bridge
