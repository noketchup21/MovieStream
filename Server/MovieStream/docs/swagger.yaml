basePath: /
definitions:
  model.Genre:
    properties:
      genre_id:
        type: integer
      genre_name:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - genre_id
    - genre_name
    type: object
  model.Movie:
    properties:
      _id:
        type: string
      admin_review:
        type: string
      genre:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      imdb_id:
        type: string
      poster_path:
        type: string
      ranking:
        $ref: '#/definitions/model.Ranking'
      title:
        maxLength: 500
        minLength: 1
        type: string
      youtube_id:
        type: string
    required:
    - genre
    - imdb_id
    - poster_path
    - ranking
    - title
    - youtube_id
    type: object
  model.Ranking:
    properties:
      ranking_name:
        maxLength: 500
        minLength: 1
        type: string
      ranking_value:
        type: integer
    required:
    - ranking_name
    - ranking_value
    type: object
  model.ResetPasswordRequest:
    properties:
      confirm_password:
        example: Password@123
        type: string
      new_password:
        example: Password@123
        type: string
      reset_token:
        example: abc123
        type: string
    type: object
  model.User:
    properties:
      _id:
        type: string
      created_at:
        type: string
      email:
        type: string
      favorite_genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      is_validated:
        type: boolean
      password:
        minLength: 5
        type: string
      refresh_token:
        type: string
      reset_password_token:
        type: string
      reset_password_token_expiry:
        type: string
      role:
        enum:
        - ADMIN
        - USER
        type: string
      token:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
      verification_code:
        type: string
      verification_expiry:
        type: string
    required:
    - email
    - favorite_genres
    - password
    - role
    - username
    type: object
  model.UserLogin:
    properties:
      email:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - password
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      favorite_genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      is_validated:
        type: boolean
      refresh_token:
        type: string
      role:
        type: string
      token:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Movie API using Gin
  title: MovieStream API
  version: "1.0"
paths:
  /createmovie:
    post:
      consumes:
      - application/json
      parameters:
      - description: Movie
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.Movie'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a movie
      tags:
      - Movies
  /genres:
    get:
      consumes:
      - application/json
      description: Retrieve the list of all movie genres
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Genre'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all genres
      tags:
      - Genres
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access & refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Invalid input / validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid email or password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Auth
  /movies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Movie'
            type: array
      summary: Get all movies
      tags:
      - Movies
  /movies/{imdb_id}:
    get:
      parameters:
      - description: IMDb ID
        in: path
        name: imdb_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Movie'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie by IMDb ID
      tags:
      - Movies
  /recommendedmovies:
    get:
      description: Returns a list of recommended movies based on the user's favorite
        genres, sorted by ranking
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Movie'
            type: array
        "400":
          description: User ID not found in context
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get recommended movies for the logged-in user
      tags:
      - Movies
  /refresh:
    post:
      consumes:
      - application/json
      description: Refresh access and refresh tokens using the refresh_token cookie
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired refresh token / User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error updating tokens
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already in use
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /resend-verification-email:
    post:
      consumes:
      - application/json
      description: Generate a new verification code and resend it to the user's email
      parameters:
      - description: Resend verification payload
        in: body
        name: data
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Verification email resent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input or email already verified
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend verification email
      tags:
      - Auth
  /resetpassword:
    post:
      consumes:
      - application/json
      description: Reset password using a valid reset password token
      parameters:
      - description: Reset password request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - none: []
      summary: Reset user password
      tags:
      - Auth
  /resetpassword-send-code:
    post:
      consumes:
      - application/json
      description: Send a reset password verification code to the user's email
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Reset password email sent successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input or email not verified
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send reset password verification code
      tags:
      - Auth
  /resetpassword-verify-code:
    post:
      consumes:
      - application/json
      description: Verify the reset password verification code sent to user's email
      parameters:
      - description: Email and reset password code
        in: body
        name: request
        required: true
        schema:
          properties:
            code:
              type: string
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Reset password code verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input, expired code, or email not verified
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid reset password code
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - none: []
      summary: Verify reset password code
      tags:
      - Auth
  /updatereview/{imdb_id}:
    patch:
      consumes:
      - application/json
      description: Admin submits a review for a movie and updates its ranking based
        on sentiment analysis
      parameters:
      - description: IMDb ID of the movie
        in: path
        name: imdb_id
        required: true
        type: string
      - description: Admin review body
        in: body
        name: review
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated review and ranking
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input or Movie ID missing
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin reviews a movie
      tags:
      - Movies
  /verify-email:
    post:
      consumes:
      - application/json
      description: Verify email using the verification code sent to the user's email
      parameters:
      - description: Email verification payload
        in: body
        name: data
        required: true
        schema:
          properties:
            code:
              type: string
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input or expired code
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid verification code
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify user email
      tags:
      - Auth
swagger: "2.0"
