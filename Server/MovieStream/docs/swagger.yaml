basePath: /
definitions:
  model.Genre:
    properties:
      genre_id:
        type: integer
      genre_name:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - genre_id
    - genre_name
    type: object
  model.Movie:
    properties:
      _id:
        type: string
      admin_review:
        type: string
      genre:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      imdb_id:
        type: string
      poster_path:
        type: string
      ranking:
        $ref: '#/definitions/model.Ranking'
      title:
        maxLength: 500
        minLength: 1
        type: string
      youtube_id:
        type: string
    required:
    - genre
    - imdb_id
    - poster_path
    - ranking
    - title
    - youtube_id
    type: object
  model.Ranking:
    properties:
      ranking_name:
        maxLength: 500
        minLength: 1
        type: string
      ranking_value:
        type: integer
    required:
    - ranking_name
    - ranking_value
    type: object
  model.User:
    properties:
      _id:
        type: string
      created_at:
        type: string
      email:
        type: string
      favorite_genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      password:
        minLength: 5
        type: string
      refresh_token:
        type: string
      role:
        enum:
        - ADMIN
        - USER
        type: string
      token:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - favorite_genres
    - password
    - role
    - username
    type: object
  model.UserLogin:
    properties:
      email:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - password
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      favorite_genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      refresh_token:
        type: string
      role:
        type: string
      token:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Movie API using Gin
  title: MovieStream API
  version: "1.0"
paths:
  /createmovie:
    post:
      consumes:
      - application/json
      parameters:
      - description: Movie
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.Movie'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a movie
      tags:
      - Movies
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access & refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Invalid input / validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid email or password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Auth
  /movies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Movie'
            type: array
      summary: Get all movies
      tags:
      - Movies
  /movies/{imdb_id}:
    get:
      parameters:
      - description: IMDb ID
        in: path
        name: imdb_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Movie'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie by IMDb ID
      tags:
      - Movies
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already in use
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
swagger: "2.0"
